# devlanes-e2e drives the real binary and builds it on first use; it runs only with
# `--profile e2e`, so the workspace run never starts nested cargo builds.
#
# Thread counts are capped: on macOS every new test binary goes through
# syspolicyd, and a full parallel run alongside builds has overwhelmed it. Run one
# nextest at a time per machine and keep these defaults.

# Docker tests share one engine; heavy tests write tens of thousands of files.
# Each group runs one test at a time, next to the other tests.
[test-groups]
docker = { max-threads = 1 }
heavy = { max-threads = 1 }

[profile.default]
default-filter = 'not package(devlanes-e2e)'
test-threads = 6
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.default.overrides]]
filter = 'test(/(^|::)docker_/)'
test-group = 'docker'

# 50,000 files and several reconnects. Its waits fail when the sync stops making
# progress, and its own 15-minute timeout is only a hang guard, so nextest ends it
# after that, at 16 minutes. It runs alone: writing and syncing that many files has
# slowed tests next to it on a Windows runner from about 4 s to past their 60 s limit.
[[profile.default.overrides]]
filter = 'test(/(^|::)large_sync_/)'
test-group = 'heavy'
threads-required = 'num-test-threads'
slow-timeout = { period = "120s", terminate-after = 8 }

[profile.e2e]
default-filter = 'package(devlanes-e2e)'
test-threads = 2
slow-timeout = { period = "120s", terminate-after = 3 }

[[profile.e2e.overrides]]
filter = 'test(/(^|::)docker_/)'
test-group = 'docker'
