name: kache
description: >-
  Install the pinned kache release that .cargo/config.toml uses as rustc wrapper, and connect
  it to the shared S3 cache when the bucket and both keys are set. Without them, kache
  only uses the job's own local store.
inputs:
  s3-bucket:
    description: Remote cache bucket.
    required: false
    default: ""
  s3-endpoint:
    description: S3 endpoint, such as https://<account-id>.r2.cloudflarestorage.com for R2.
    required: false
    default: ""
  s3-region:
    description: Bucket region; "auto" for R2.
    required: false
    default: ""
  s3-access-key:
    description: Access key id for the bucket.
    required: false
    default: ""
  s3-secret-key:
    description: Secret access key for the bucket.
    required: false
    default: ""
runs:
  using: composite
  steps:
    # kache 1.2.2 can't wrap cl.exe: cc routes C compiles through RUSTC_WRAPPER when it
    # is kache, and 1.2.2 rejects `kache cl.exe ...`, so ring, libsqlite3-sys and zstd-sys
    # fail to build. https://github.com/kunobi-ninja/kache/pull/1640 fixes it but was
    # merged after 1.2.2. Until a release includes it, Windows builds kache from a commit
    # that has the fix; replace this with a release asset in the step below once one ships.
    - if: runner.os == 'Windows'
      id: windows-kache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/kache-git
        key: kache-git-a37fb5ff3bcc86adfded7f3ecb4f7c5100f744c2-${{ runner.os }}-${{ runner.arch }}
    - if: runner.os == 'Windows'
      name: Install kache (Windows, from git)
      shell: bash
      env:
        KACHE_REV: a37fb5ff3bcc86adfded7f3ecb4f7c5100f744c2
        CACHED: ${{ steps.windows-kache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        root=$RUNNER_TEMP/kache-git
        if [ "$CACHED" != true ]; then
          # Outside the checkout, so the repository's rustc-wrapper and toolchain don't apply.
          cd "$RUNNER_TEMP"
          env -u RUSTC_WRAPPER CARGO_BUILD_RUSTC_WRAPPER= \
            cargo install --locked --git https://github.com/kunobi-ninja/kache --rev "$KACHE_REV" --root "$root" kache
        fi
        "$root/bin/kache" --version
        echo "$root/bin" >> "$GITHUB_PATH"
        echo "KACHE_CACHE_DIR=$RUNNER_TEMP/kache" >> "$GITHUB_ENV"
    - if: runner.os != 'Windows'
      name: Install kache
      shell: bash
      env:
        KACHE_VERSION: 1.2.2
      run: |
        set -euo pipefail
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64) target=x86_64-unknown-linux-musl sha=f2f6555dee50945c2a90a7fb793c2084a00cc6459d08ac2306d38d905064321b ;;
          Linux-aarch64) target=aarch64-unknown-linux-musl sha=38856cee613f6ee0ec579099fc9205b840a0b45bb763f4b8fa782d25d93c18ef ;;
          Darwin-arm64) target=aarch64-apple-darwin sha=10d09e146852a8df8796cf642ca58872107a7f391b7647ec8cc253cf289af0a9 ;;
          Darwin-x86_64) target=x86_64-apple-darwin sha=9a1c3ecc89cf36b23512a93868226140d46f1f70cf6cb648bfe08eeafb25a368 ;;
          *) echo "::error::no pinned kache release for $(uname -s)-$(uname -m)"; exit 1 ;;
        esac
        dir=$RUNNER_TEMP/kache-bin
        mkdir -p "$dir"
        curl -fsSL --retry 3 -o "$dir/kache.tar.gz" \
          "https://github.com/kunobi-ninja/kache/releases/download/v$KACHE_VERSION/kache-$target.tar.gz"
        if command -v sha256sum >/dev/null; then
          actual=$(sha256sum < "$dir/kache.tar.gz")
        else
          actual=$(shasum -a 256 < "$dir/kache.tar.gz")
        fi
        if [ "${actual%% *}" != "$sha" ]; then
          echo "::error::kache-$target.tar.gz does not match the pinned SHA-256"
          exit 1
        fi
        tar -xzf "$dir/kache.tar.gz" -C "$dir" kache
        rm "$dir/kache.tar.gz"
        "$dir/kache" --version
        echo "$dir" >> "$GITHUB_PATH"
        # On the workspace's filesystem, so restores link into target/ instead of copying.
        echo "KACHE_CACHE_DIR=$RUNNER_TEMP/kache" >> "$GITHUB_ENV"
    # The daemon uploads what the build compiles and fetches what it misses. It drops
    # remote settings from the environment, so they go in the config file, and it keeps
    # the credentials it was started with, so only this step sees the secrets.
    - name: Connect the remote cache
      shell: bash
      env:
        BUCKET: ${{ inputs.s3-bucket }}
        ENDPOINT: ${{ inputs.s3-endpoint }}
        REGION: ${{ inputs.s3-region }}
        ACCESS_KEY: ${{ inputs.s3-access-key }}
        SECRET_KEY: ${{ inputs.s3-secret-key }}
        # Pushes to the default branch upload to `artifacts`. Pull requests read it, fall
        # back to `pr-artifacts` for what it lacks and upload only there, so they reuse each
        # other's work without ever reaching main's builds. Every other job is read-only;
        # kache also refuses uploads from any job that is neither a pull request nor a push
        # to a protected branch. The bucket's lifecycle rule expires `pr-artifacts/`.
        WRITE: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
      run: |
        set -euo pipefail
        if [ -z "$BUCKET" ] || [ -z "$ACCESS_KEY" ] || [ -z "$SECRET_KEY" ]; then
          echo "No remote cache configured; kache uses only this job's local store."
          exit 0
        fi
        config=$RUNNER_TEMP/kache.toml
        {
          echo "[cache]"
          # remote_readonly would also stop a pull request from writing to its prefix.
          if [ "$WRITE" != true ] && [ "$PULL_REQUEST" != true ]; then echo "remote_readonly = true"; fi
          echo "[cache.remote]"
          echo 'type = "s3"'
          echo "bucket = \"$BUCKET\""
          echo 'prefix = "artifacts"'
          echo 'pull_request_prefix = "pr-artifacts"'
          if [ -n "$ENDPOINT" ]; then echo "endpoint = \"$ENDPOINT\""; fi
          if [ -n "$REGION" ]; then echo "region = \"$REGION\""; fi
        } > "$config"
        echo "KACHE_CONFIG=$config" >> "$GITHUB_ENV"
        KACHE_CONFIG=$config KACHE_S3_ACCESS_KEY=$ACCESS_KEY KACHE_S3_SECRET_KEY=$SECRET_KEY kache daemon start
