name: CI
on:
  # Branches are checked through their pull request; a push to every branch
  # would run the same checks twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to a pull request replaces its running checks. Every other run gets
# its own group, so each commit on main finishes and uploads its kache entries.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  # Separate from the rust job so clippy and the test build run in parallel; on
  # Windows they take about 5 and 10 minutes.
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: ./.github/actions/kache
        with:
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-region: ${{ vars.KACHE_S3_REGION }}
          s3-access-key: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
      # Formatting is the same on every OS; clippy sees each OS's cfg code.
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: kache stats
        if: ${{ !cancelled() }}
        run: |
          # --full adds the "Not cached" reasons and the remote upload and download counts.
          kache stats --full
          # Lets the daemon finish its queued uploads before the runner goes away.
          kache daemon stop
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows compiles and links about twice as slowly, and the large sync test
    # alone takes four minutes on NTFS.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: ./.github/actions/kache
        with:
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-region: ${{ vars.KACHE_S3_REGION }}
          s3-access-key: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      # The default nextest profile leaves out devlanes-e2e; the e2e jobs run it.
      # Every nextest step runs all tests and repeats failed output at the end, so
      # one failure neither hides the others nor gets buried in the PASS lines.
      - run: cargo nextest run --workspace --all-features --locked --no-fail-fast --failure-output immediate-final
      # Only the Linux runners have Docker. This reuses the test binaries built above.
      - name: Docker tests
        if: runner.os == 'Linux'
        run: |
          docker info
          docker compose version
          cargo nextest run --workspace --all-features --locked --no-fail-fast --failure-output immediate-final --run-ignored only -E 'test(/(^|::)docker_/)'
      - run: cargo test --workspace --doc --all-features --locked
      - name: kache stats
        if: ${{ !cancelled() }}
        run: |
          # --full adds the "Not cached" reasons and the remote upload and download counts.
          kache stats --full
          # Lets the daemon finish its queued uploads before the runner goes away.
          kache daemon stop
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: shellcheck
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive=$RUNNER_TEMP/actionlint.tar.gz
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: actionlint
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - run: sh packaging/scripts/check.sh
  # install.ps1, package.ps1 and the npm launcher on Windows, against a fake
  # devlanes.exe, so no Rust build is needed.
  packaging-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PSScriptAnalyzer
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
      - run: ./packaging/scripts/check.ps1
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows builds take longer.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 30 }}
    env:
      DEVLANES_E2E_BIN_DIR: ${{ github.workspace }}/target/debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: ./.github/actions/kache
        with:
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-region: ${{ vars.KACHE_S3_REGION }}
          s3-access-key: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      # Built once here; each nextest test process would otherwise run cargo build
      # itself (on Windows tests never build, so the binaries must exist first).
      - run: cargo build -p devlanes -p devlanes-testing --locked
      - run: cargo nextest run --profile e2e --locked --no-fail-fast --failure-output immediate-final
      # Only the Linux runners have Docker.
      - name: Docker tests
        if: runner.os == 'Linux'
        run: |
          docker info
          docker compose version
          cargo nextest run --profile e2e --locked --no-fail-fast --failure-output immediate-final --run-ignored only -E 'test(/(^|::)docker_/)'
      - name: kache stats
        if: ${{ !cancelled() }}
        run: |
          # --full adds the "Not cached" reasons and the remote upload and download counts.
          kache stats --full
          # Lets the daemon finish its queued uploads before the runner goes away.
          kache daemon stop
  ssh:
    # `needs ssh` tests against a throwaway sshd container; the script builds the box's
    # Linux devlanes in rust:1.99.1-bookworm and always removes the container.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: ./.github/actions/kache
        with:
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-region: ${{ vars.KACHE_S3_REGION }}
          s3-access-key: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
      # The box binary's target dir and registry, built inside the container.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ssh-box
          key: ssh-box-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ssh-box-
      - run: docker info
      - run: bash e2e/ssh/run.sh
        env:
          DEVLANES_TEST_SSH_CACHE: ${{ runner.temp }}/ssh-box
      - name: kache stats
        if: ${{ !cancelled() }}
        run: |
          # --full adds the "Not cached" reasons and the remote upload and download counts.
          kache stats --full
          # Lets the daemon finish its queued uploads before the runner goes away.
          kache daemon stop
