name: Next
# Each commit on main that passes CI is built as `X.Y.(Z+1)-next.N`, where X.Y.Z is the
# committed version and N counts the commits since the last stable tag, so it sorts after
# the current release and before the next one. The build replaces the assets of the
# rolling `next` prerelease, which `DEVLANES_VERSION=next sh install.sh` installs.
# Nothing else is published: npm, Homebrew and the website only ever get stable
# releases from release.yml.
#
# CI runs finish in any order, and every one starts this workflow, so only the tip of
# main is built. A run for an older commit, a failed CI run or a pull request stops in
# `version` without touching a running build; that's why the concurrency groups sit on
# `build` and `publish` instead of the whole workflow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      current: ${{ steps.version.outputs.current }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The commit count since the last stable tag needs the history and tags.
          fetch-depth: 0
          persist-credentials: false
      - name: Next version
        id: version
        run: |
          sha=$(git rev-parse HEAD)
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$sha" != "$tip" ]; then
            echo "::notice::$sha is no longer the tip of main ($tip); its own CI run builds that"
            exit 0
          fi
          next=$(python3 -c '
          import tomllib
          version = tomllib.load(open("bins/devlanes/Cargo.toml", "rb"))["package"]["version"]
          major, minor, patch = version.split("-")[0].split(".")
          print(f"{major}.{minor}.{int(patch) + 1}")
          ')
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' 2>/dev/null || true)
          count=$(git rev-list --count "${last:+$last..}HEAD")
          version=$next-next.$count
          echo "::notice::Building $version"
          {
            echo "current=true"
            echo "version=$version"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.current == 'true'
    # A newer tip replaces a build still running.
    concurrency:
      group: next-build
      cancel-in-progress: true
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.sha }}
      snapshot: true

  publish:
    needs: [version, build]
    # Publishes one at a time and never cancels: a half-replaced release would leave
    # SHA256SUMS listing archives that aren't there.
    concurrency:
      group: next-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The rolling `next` prerelease; release.yml deploys the other environments.
    environment:
      name: next
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/next
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      # A newer tip may have been pushed during the build; its own run publishes it.
      - name: Still the tip of main
        id: tip
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$SHA" = "$tip" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main moved to $tip while $SHA was building; not publishing it"
          fi
      - if: steps.tip.outputs.current
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums, release manifest and schemas
        if: steps.tip.outputs.current
        run: |
          sh packaging/scripts/manifest.sh "$VERSION" dist \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/next"
          jq -e '.artifacts | length == 4' dist/release-manifest.json
          cp crates/config/schema.json crates/config/user-schema.json dist/
          cp install.sh install.ps1 dist/
      - name: Attest build provenance
        if: steps.tip.outputs.current
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Replace the next release
        if: steps.tip.outputs.current
        run: |
          repo=repos/$GITHUB_REPOSITORY
          if gh api "$repo/git/refs/tags/next" >/dev/null 2>&1; then
            gh api --method PATCH "$repo/git/refs/tags/next" -f sha="$SHA" -F force=true >/dev/null
          else
            gh api "$repo/git/refs" -f ref=refs/tags/next -f sha="$SHA" >/dev/null
          fi
          notes=$RUNNER_TEMP/notes.md
          cat > "$notes" <<EOF
          Latest build of main: \`$VERSION\`, from $SHA.

          Not a release; it is replaced on every commit to main that passes CI. Install it with:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | DEVLANES_VERSION=next sh
          \`\`\`

          On Windows, in PowerShell:

          \`\`\`powershell
          \$env:DEVLANES_VERSION = 'next'; irm https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.ps1 | iex
          \`\`\`
          EOF
          # SHA256SUMS goes last and old archives are deleted after it, so the install
          # scripts always find the archives that the SHA256SUMS they read lists.
          set -- dist/*.tar.gz dist/*.zip dist/release-manifest.json dist/schema.json dist/user-schema.json dist/install.sh dist/install.ps1
          if gh release view next >/dev/null 2>&1; then
            gh release edit next --prerelease --latest=false --title "devlanes next" --notes-file "$notes"
            gh release upload next --clobber "$@"
            gh release upload next --clobber dist/SHA256SUMS
            for asset in $(gh release view next --json assets --jq '.assets[].name'); do
              if [ ! -e "dist/$asset" ]; then
                gh release delete-asset next "$asset" --yes
              fi
            done
          else
            gh release create next --prerelease --latest=false --verify-tag \
              --title "devlanes next" --notes-file "$notes" "$@" dist/SHA256SUMS
          fi
