name: Release
# A `v*` tag tests the commit, builds the archives and uploads them to a draft
# release. The release is published only after every asset is attached, so the
# Homebrew formula, npm packages, cargo binstall and install.sh never see a
# half-filled release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  # The tests run here, in parallel with the builds, instead of waiting for the CI
  # workflow's result on the tag commit: that would need polling another workflow and
  # breaks when CI never ran for the commit.
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install
      # Reads the store the CI rust job saved on the default branch; the same tests
      # with the same features, so most of the workspace restores instead of compiling.
      - uses: ./.github/actions/kache
        with:
          store: rust
          save: "false"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      - run: cargo nextest run --workspace --all-features --locked
      - name: kache stats
        if: ${{ !cancelled() }}
        run: kache stats

  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            native: true
          # Cross-compiled on the arm64 runner, so it is built but not executed.
          - target: x86_64-apple-darwin
            os: macos-latest
            native: false
          # 22.04 runners keep the glibc requirement at 2.35, so the binaries also
          # run on Debian 12 and Ubuntu 22.04 hosts that SSH bootstrap installs onto.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            native: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            native: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
      # kache passes every compile straight to rustc here: shipped binaries are always
      # compiled from source, and release targets share no cache entries with CI anyway.
      KACHE_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      # .cargo/config.toml names kache as rustc wrapper, so it must exist even when disabled.
      - uses: ./.github/actions/kache
      - name: Check the tag against the workspace and plugin versions
        run: |
          version=${GITHUB_REF_NAME#v}
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "devlanes") | .version')
          plugin=$(jq -r .version agent-plugin/.claude-plugin/plugin.json)
          if [ "$version" != "$crate" ] || [ "$version" != "$plugin" ]; then
            echo "::error::tag $GITHUB_REF_NAME, devlanes $crate and agent-plugin/.claude-plugin/plugin.json $plugin must match"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p devlanes -p devlanes-hosts-helper
      # build.rs regenerates the served schemas; a difference means they were committed stale.
      - name: Check the committed schemas
        run: git diff --exit-code crates/config/schema.json crates/config/user-schema.json
      - name: Smoke test
        if: matrix.native
        run: |
          "target/$TARGET/release/devlanes" --version | grep -Fx "devlanes $VERSION"
          "target/$TARGET/release/devlanes-hosts" version | grep -F "build=release"
      - name: Package
        run: sh packaging/scripts/package.sh "$VERSION" "$TARGET" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Version
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          case $version in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Checksums, release manifest and schemas
        run: |
          sh packaging/scripts/manifest.sh "$VERSION" dist \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          jq -e '.artifacts | length == 4' dist/release-manifest.json
          cp crates/config/schema.json crates/config/user-schema.json dist/
      # Verify with: gh attestation verify devlanes-VERSION-TARGET.tar.gz --repo devlanes-run/devlanes
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Homebrew formula
        run: |
          mkdir -p formula
          sh packaging/homebrew/render.sh "$VERSION" dist/SHA256SUMS > formula/devlanes.rb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formula
          path: formula/
          if-no-files-found: error
      - name: Upload to a draft release
        run: |
          set -- dist/*.tar.gz dist/SHA256SUMS dist/release-manifest.json dist/schema.json dist/user-schema.json
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            # A rerun may refill a draft, but published assets are never replaced.
            if [ "$draft" != true ]; then
              echo "::error::release $GITHUB_REF_NAME is already published"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" --clobber "$@"
          else
            prerelease=
            if [ "$PRERELEASE" = true ]; then prerelease=--prerelease; fi
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag ${prerelease:+"$prerelease"} \
              --title "devlanes $VERSION" --generate-notes "$@"
          fi

  publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish the release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  homebrew-verify:
    needs: [release, publish]
    if: needs.release.outputs.prerelease == 'false'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formula
          path: formula
      - name: Install and test the formula from the published release
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew tap devlanes-run/tap
          # Homebrew 6 loads non-official taps only after explicit trust.
          if brew help trust >/dev/null 2>&1; then
            brew trust --formula devlanes-run/tap/devlanes
          fi
          cp formula/devlanes.rb "$(brew --repository devlanes-run/tap)/Formula/devlanes.rb"
          brew audit --formula devlanes-run/tap/devlanes
          brew install devlanes-run/tap/devlanes
          brew test devlanes-run/tap/devlanes

  homebrew-publish:
    needs: [release, homebrew-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formula
          path: formula
      - name: Push the formula to devlanes-run/homebrew-tap
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ needs.release.outputs.version }}
        with:
          github-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = 'devlanes-run';
            const repo = 'homebrew-tap';
            const path = 'Formula/devlanes.rb';
            const version = process.env.VERSION;
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error(`not a stable version: ${version}`);
            const content = fs.readFileSync('formula/devlanes.rb');

            let current;
            try {
              current = (await github.rest.repos.getContent({ owner, repo, path, ref: 'main' })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (current) {
              const old = Buffer.from(current.content, 'base64');
              if (old.equals(content)) return;
              // A rerun of an older tag must not replace the formula of a newer release.
              const oldVersion = old.toString('utf8').match(/releases\/download\/v(\d+\.\d+\.\d+)\//)?.[1];
              if (oldVersion) {
                const before = oldVersion.split('.').map(Number);
                const after = version.split('.').map(Number);
                const first = before.findIndex((part, index) => part !== after[index]);
                if (first !== -1 && before[first] > after[first]) {
                  core.notice(`Kept the newer tap version ${oldVersion}`);
                  return;
                }
              }
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main',
              message: `devlanes ${version}`,
              content: content.toString('base64'),
              ...(current ? { sha: current.sha } : {}),
            });
            core.notice(`Published devlanes ${version} to ${owner}/${repo}`);

  npm:
    needs: [release, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Trusted publishing: npm exchanges the job's OIDC token for a publish token, so
    # no npm secret exists. Each package's trusted publisher names this file.
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      PRERELEASE: ${{ needs.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The archives keep the executable bits that an uploaded package directory would lose.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: npm with trusted publishing support
        run: |
          npm install -g npm@11
          # Trusted publishing needs npm 11.5.1 or later.
          printf '11.5.1\n%s\n' "$(npm --version)" | sort -V -C
      - name: Build the packages
        run: sh packaging/npm/build.sh "$VERSION" dist npm
      - name: Publish, platform packages first
        run: |
          tag=latest
          if [ "$PRERELEASE" = true ]; then tag=next; fi
          for dir in npm/devlanes-*/ npm/devlanes/; do
            name=$(jq -r .name "$dir/package.json")
            # Reruns skip versions already on the registry; a plain read needs no npm auth.
            if curl -fs -o /dev/null "https://registry.npmjs.org/$name/$VERSION"; then
              echo "$name@$VERSION is already published"
              continue
            fi
            npm publish "$dir" --provenance --access public --tag "$tag"
          done
