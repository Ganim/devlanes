name: Release
# A `v*` tag tests the commit, builds the archives and uploads them to a draft
# release. The release is published only after every asset is attached, so the
# Homebrew formula, npm packages, cargo binstall and install.sh never see a
# half-filled release. sampo.yml dispatches it on the tag it creates, because tags
# pushed with GITHUB_TOKEN start no workflows; a tag pushed by hand starts it directly.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  # The tests run here, in parallel with the builds, instead of waiting for the CI
  # workflow's result on the tag commit: that would need polling another workflow and
  # breaks when CI never ran for the commit.
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      # Reads what the CI rust job uploaded from the default branch; the same tests
      # with the same features, so most of the workspace restores instead of compiling.
      - uses: ./.github/actions/kache
        with:
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-region: ${{ vars.KACHE_S3_REGION }}
          s3-access-key: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      - run: cargo nextest run --workspace --all-features --locked
      - name: kache stats
        if: ${{ !cancelled() }}
        run: |
          kache stats
          kache daemon stop

  tag-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          case $GITHUB_REF in
          refs/tags/v*) echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" ;;
          *)
            echo "::error::run this workflow on a v* tag, not $GITHUB_REF"
            exit 1
            ;;
          esac
      # sampo.yml dispatches this workflow, so its run doesn't show in the tagged commit's
      # checks; this status does, and the `status` job settles it.
      - name: Mark the release as started on the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=release \
            -f "description=Releasing $GITHUB_REF_NAME" \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  # Builds every target, and fails when the tag doesn't match the committed Cargo.toml
  # and plugin.json versions. kache downloads what the next builds of main compiled.
  build:
    needs: tag-version
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ needs.tag-version.outputs.version }}

  # The npm job publishes every package in the launcher's optionalDependencies. A
  # package that does not exist yet can only be created by its owner (trusted
  # publishing needs an existing package), so a missing one stops the release
  # before a draft exists, instead of after the GitHub release is published.
  npm-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every npm package exists on the registry
        run: |
          missing=
          for name in devlanes $(jq -r '.optionalDependencies | keys[]' packaging/npm/devlanes/package.json); do
            if ! npm view "$name" name >/dev/null 2>&1; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::not on the npm registry:$missing; create each with trusted publishing first (packaging/README.md)"
            exit 1
          fi

  release:
    needs: [test, build, npm-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Version
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          case $version in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Checksums, release manifest and schemas
        run: |
          sh packaging/scripts/manifest.sh "$VERSION" dist \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          jq -e '.artifacts | length == 4' dist/release-manifest.json
          cp crates/config/schema.json crates/config/user-schema.json dist/
          cp install.sh install.ps1 dist/
      # The notes are this version's section of the devlanes changelog, the one users
      # read; GitHub's generated notes only list pull request titles.
      - name: Release notes
        run: |
          awk -v heading="## $VERSION" '
            /^## / { if (found) exit; found = ($0 == heading || index($0, heading " ") == 1); next }
            found
          ' bins/devlanes/CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::warning::bins/devlanes/CHANGELOG.md has no $VERSION section; using generated notes"
            rm notes.md
          fi
      # Verify with: gh attestation verify devlanes-VERSION-TARGET.tar.gz --repo devlanes-run/devlanes
      # (or the .zip for Windows).
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Homebrew formula
        run: |
          mkdir -p formula
          sh packaging/homebrew/render.sh "$VERSION" dist/SHA256SUMS > formula/devlanes.rb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formula
          path: formula/
          if-no-files-found: error
      - name: Upload to a draft release
        run: |
          set -- dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/release-manifest.json dist/schema.json dist/user-schema.json dist/install.sh dist/install.ps1
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            # A rerun may refill a draft, but published assets are never replaced.
            if [ "$draft" != true ]; then
              echo "::error::release $GITHUB_REF_NAME is already published"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" --clobber "$@"
          else
            prerelease=
            if [ "$PRERELEASE" = true ]; then prerelease=--prerelease; fi
            notes=--generate-notes
            if [ -f notes.md ]; then notes=--notes-file=notes.md; fi
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag ${prerelease:+"$prerelease"} \
              --title "devlanes $VERSION" "$notes" "$@"
          fi

  publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Every job that publishes somewhere deploys to a GitHub environment named after
    # that place, so the repository page shows what each one serves; next.yml deploys
    # `next`.
    environment:
      name: github-release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish the release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  website:
    needs: [release, publish]
    if: needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: website
      url: https://devlanes.run
    steps:
      # The website takes the docs, JSON Schemas and install.sh from this tag.
      - name: Publish this release on the website
        env:
          # Fine-grained token scoped to website with Contents write permission.
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          gh api --method POST repos/devlanes-run/website/dispatches \
            -f event_type=source-release \
            -f "client_payload[repository]=$GITHUB_REPOSITORY" \
            -f "client_payload[tag]=$GITHUB_REF_NAME"

  homebrew-verify:
    needs: [release, publish]
    if: needs.release.outputs.prerelease == 'false'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formula
          path: formula
      - name: Install and test the formula from the published release
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew tap devlanes-run/tap
          # Homebrew 6 loads non-official taps only after explicit trust.
          if brew help trust >/dev/null 2>&1; then
            brew trust --formula devlanes-run/tap/devlanes
          fi
          cp formula/devlanes.rb "$(brew --repository devlanes-run/tap)/Formula/devlanes.rb"
          brew audit --formula devlanes-run/tap/devlanes
          brew install devlanes-run/tap/devlanes
          brew test devlanes-run/tap/devlanes

  homebrew-publish:
    needs: [release, homebrew-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: homebrew
      url: https://github.com/devlanes-run/homebrew-tap/blob/main/Formula/devlanes.rb
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formula
          path: formula
      - name: Push the formula to devlanes-run/homebrew-tap
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ needs.release.outputs.version }}
        with:
          github-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = 'devlanes-run';
            const repo = 'homebrew-tap';
            const path = 'Formula/devlanes.rb';
            const version = process.env.VERSION;
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error(`not a stable version: ${version}`);
            const content = fs.readFileSync('formula/devlanes.rb');

            let current;
            try {
              current = (await github.rest.repos.getContent({ owner, repo, path, ref: 'main' })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (current) {
              const old = Buffer.from(current.content, 'base64');
              if (old.equals(content)) return;
              // A rerun of an older tag must not replace the formula of a newer release.
              const oldVersion = old.toString('utf8').match(/releases\/download\/v(\d+\.\d+\.\d+)\//)?.[1];
              if (oldVersion) {
                const before = oldVersion.split('.').map(Number);
                const after = version.split('.').map(Number);
                const first = before.findIndex((part, index) => part !== after[index]);
                if (first !== -1 && before[first] > after[first]) {
                  core.notice(`Kept the newer tap version ${oldVersion}`);
                  return;
                }
              }
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: 'main',
              message: `devlanes ${version}`,
              content: content.toString('base64'),
              ...(current ? { sha: current.sha } : {}),
            });
            core.notice(`Published devlanes ${version} to ${owner}/${repo}`);

  npm:
    needs: [release, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Trusted publishing: npm exchanges the job's OIDC token for a publish token, so
    # no npm secret exists. Each package's trusted publisher names this file and the
    # `npm` environment.
    environment:
      name: npm
      url: https://www.npmjs.com/package/devlanes/v/${{ needs.release.outputs.version }}
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      PRERELEASE: ${{ needs.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The archives keep the executable bits that an uploaded package directory would lose.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later; Node 24 ships it.
      - name: Check npm supports trusted publishing
        run: printf '11.5.1\n%s\n' "$(npm --version)" | sort -V -C
      - name: Build the packages
        run: sh packaging/npm/build.sh "$VERSION" dist npm
      - name: Publish, platform packages first
        run: |
          tag=latest
          if [ "$PRERELEASE" = true ]; then tag=next; fi
          for dir in npm/devlanes-*/ npm/devlanes/; do
            name=$(jq -r .name "$dir/package.json")
            # Reruns skip versions already on the registry; a plain read needs no npm auth.
            if curl -fs -o /dev/null "https://registry.npmjs.org/$name/$VERSION"; then
              echo "$name@$VERSION is already published"
              continue
            fi
            npm publish "$dir" --provenance --access public --tag "$tag"
          done

  # Settles the `release` status that tag-version posted. Jobs skipped for a prerelease
  # count as passed; rerunning failed jobs runs this one again.
  status:
    needs: [tag-version, test, build, npm-preflight, release, publish, website, homebrew-verify, homebrew-publish, npm]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Mark the release as finished on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          state=success
          description="Released $GITHUB_REF_NAME"
          if [ "$FAILED" = true ]; then
            state=failure
            description="Release of $GITHUB_REF_NAME failed"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f "state=$state" -f context=release -f "description=$description" \
            -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
