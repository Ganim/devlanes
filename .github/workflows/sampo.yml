name: Sampo
# Sampo's action keeps the release pull request (branch release/main) up to date while
# change files are pending, and tags the new versions once it merges. The steps after it
# cover what Sampo doesn't know about: the plugin manifests carry the version, and its
# tags don't start release.yml. packaging/README.md has the details.
on:
  push:
    branches: [main]
permissions:
  contents: read
# A newer push must not cancel a run halfway through pushing tags, nor one still waiting:
# the run for a release PR's merge is the one that tags it.
concurrency:
  group: sampo
  cancel-in-progress: false
  queue: max
jobs:
  sampo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      BRANCH: release/main
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sampo reads the existing tags and links changelog entries to commits.
          fetch-depth: 0
      - name: Install pinned toolchain
        run: rustup toolchain install
      # Sampo's action otherwise pipes cargo-binstall's install script from its main
      # branch into bash; it skips that when cargo-binstall is already installed.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-binstall@1.25.3
      - id: sampo
        uses: bruits/sampo/crates/sampo-github-action@cbf64ba62bc12402634b872a0b0896cfde3584e7 # cargo-sampo-github-action-v0.21.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Version the plugin manifests on the release branch
        if: steps.sampo.outputs.released == 'true'
        run: |
          git fetch origin "$BRANCH"
          git switch --force-create "$BRANCH" "origin/$BRANCH"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("bins/devlanes/Cargo.toml", "rb"))["package"]["version"])')
          # sed keeps the file's formatting, which jq would rewrite.
          for plugin in agent-plugin/.claude-plugin/plugin.json agent-plugin/.codex-plugin/plugin.json; do
            sed -i "s/^  \"version\": \"[^\"]*\"/  \"version\": \"$version\"/" "$plugin"
            jq -e --arg version "$version" '.version == $version' "$plugin" >/dev/null
          done
          git add agent-plugin/.claude-plugin/plugin.json agent-plugin/.codex-plugin/plugin.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit --quiet -m "Version the plugin manifests for $version"
          git push origin "$BRANCH"

      - name: Start the release
        if: steps.sampo.outputs.published == 'true'
        run: |
          tag=$(git tag --points-at HEAD --list 'v[0-9]*' | head -n 1)
          if [ -z "$tag" ]; then
            echo "No new devlanes version tag on this commit"
            exit 0
          fi
          gh workflow run release.yml --ref "$tag"
          echo "::notice::Started release.yml for $tag"
