version = 1

[git]
# devlanes is tagged vX.Y.Z, which release.yml builds; the other crates keep the
# default devlanes-<name>-vX.Y.Z.
short_tags = "devlanes"

[changelog]
show_acknowledgments = false
# Crates bumped only because a dependency changed get one "version bump only" section
# instead of an "Updated dependencies" entry.
automatic_entries = "collapse"

[packages]
# The two binaries users install carry the release version: devlanes and the
# devlanes-hosts helper. Library crates report it through devlanes-version, which reads
# it from bins/devlanes/Cargo.toml.
fixed = [["cargo/devlanes", "cargo/devlanes-hosts-helper"]]
# Every other crate keeps its own version. A crate that changes, and everything that
# depends on it up to devlanes, takes the release's biggest bump; the rest stay put.
# A new crate goes here.
linked = [[
  "cargo/devlanes-agent-hooks",
  "cargo/devlanes-cli",
  "cargo/devlanes-client",
  "cargo/devlanes-config",
  "cargo/devlanes-core",
  "cargo/devlanes-daemon",
  "cargo/devlanes-e2e",
  "cargo/devlanes-env-direnv",
  "cargo/devlanes-env-mise",
  "cargo/devlanes-git",
  "cargo/devlanes-infra-compose",
  "cargo/devlanes-infra-docker",
  "cargo/devlanes-ipc",
  "cargo/devlanes-logs",
  "cargo/devlanes-metrics",
