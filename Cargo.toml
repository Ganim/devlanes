[workspace]
members = ["bins/devlanes", "crates/*", "e2e"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/devlanes-run/devlanes"
publish = false

[workspace.dependencies]
async-trait = "0.1"
anyhow = "1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
# `std::fs::canonicalize` on Unix; on Windows it avoids the `\\?\` form Git and
# most tools cannot use.
dunce = "1"
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: JSON output follows struct field order, and the feature is pinned
# here so per-crate and workspace builds don't disagree through feature unification.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tracing = "0.1"
tempfile = "3"
windows-sys = { version = "0.61", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"

[profile.dev]
debug = "line-tables-only"

# Release binaries are shipped (GitHub releases, Homebrew, npm); size and speed matter
# more than build time there.
[profile.release]
lto = "thin"
# 4, not 1: a release always recompiles devlanes-daemon and the devlanes binary (their
# versions change, so kache has no entry), and with 1 unit each compiles on one thread.
# Measured on 0.5.0's code, rebuilding those crates took 4m13s with 1 unit, 1m32s with 4
# and 1m28s with Cargo's default of 16, for a binary 8% (4) or 21% (16) bigger than with 1.
# The macOS runners have 3 cores, so more units than 4 gain little.
codegen-units = 4
strip = true
