[package]
name = "devlanes"
description = "Run a dev environment per git worktree, side by side: CLI, TUI and daemon in one binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `cargo binstall --git https://github.com/devlanes-run/devlanes devlanes` downloads the
# release archive built by .github/workflows/release.yml instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/devlanes-{ version }-{ target }.tar.gz"
bin-dir = "devlanes-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install"]

# Windows releases are zip archives with devlanes.exe in the same directory. Exact
# targets rather than a cfg() key, which older binstall versions do not read.
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/devlanes-{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/devlanes-{ version }-{ target }.zip"
pkg-fmt = "zip"

[lints]
workspace = true

# OS-specific integrations stay above [dependencies] so appended entries land in the shared table.
[target.'cfg(target_os = "macos")'.dependencies]
devlanes-trust-macos = { path = "../../crates/trust-macos" }

[target.'cfg(target_os = "linux")'.dependencies]
devlanes-trust-linux = { path = "../../crates/trust-linux" }

[target.'cfg(unix)'.dependencies]
devlanes-runner-pty = { path = "../../crates/runner-pty" }
devlanes-tunnel = { path = "../../crates/tunnel" }
rustix = { version = "1", features = ["process", "termios"] }

[target.'cfg(windows)'.dependencies]
devlanes-resolver-nrpt = { path = "../../crates/resolver-nrpt" }
devlanes-runner-windows = { path = "../../crates/runner-windows" }
devlanes-shell-windows = { path = "../../crates/shell-windows" }
devlanes-sys-windows = { path = "../../crates/sys-windows" }
devlanes-trust-windows = { path = "../../crates/trust-windows" }

[dev-dependencies]
tempfile.workspace = true

# `fake-tool` stands in for mkcert on Windows, where `#!/bin/sh` fakes cannot run.
[target.'cfg(windows)'.dev-dependencies]
devlanes-testing = { path = "../../crates/testing" }

[build-dependencies]
devlanes-config = { path = "../../crates/config" }
devlanes-preset-vite = { path = "../../crates/preset-vite" }
devlanes-preset-next = { path = "../../crates/preset-next" }
devlanes-preset-wrangler = { path = "../../crates/preset-wrangler" }
devlanes-preset-tauri = { path = "../../crates/preset-tauri" }

[dependencies]
devlanes-cli = { path = "../../crates/cli" }
devlanes-client = { path = "../../crates/client" }
devlanes-config = { path = "../../crates/config" }
devlanes-daemon = { path = "../../crates/daemon" }
devlanes-ipc = { path = "../../crates/ipc" }
devlanes-pki = { path = "../../crates/pki" }
devlanes-proto = { path = "../../crates/proto" }
devlanes-term = { path = "../../crates/term" }
devlanes-trust = { path = "../../crates/trust" }
devlanes-tui = { path = "../../crates/tui" }
devlanes-core = { path = "../../crates/core" }
devlanes-env-direnv = { path = "../../crates/env-direnv" }
devlanes-env-mise = { path = "../../crates/env-mise" }
devlanes-infra-compose = { path = "../../crates/infra-compose" }
devlanes-infra-docker = { path = "../../crates/infra-docker" }
# Same version as devlanes-infra-docker; named only to read Docker's HTTP error status.
bollard = "0.21"
devlanes-metrics = { path = "../../crates/metrics" }
devlanes-metrics-docker = { path = "../../crates/metrics-docker" }
devlanes-metrics-linux = { path = "../../crates/metrics-linux" }
devlanes-metrics-macos = { path = "../../crates/metrics-macos" }
devlanes-metrics-windows = { path = "../../crates/metrics-windows" }
devlanes-platform-node = { path = "../../crates/platform-node" }
devlanes-platform-python = { path = "../../crates/platform-python" }
devlanes-run-script-cargo = { path = "../../crates/run-script-cargo" }
devlanes-run-script-deno = { path = "../../crates/run-script-deno" }
devlanes-run-script-python = { path = "../../crates/run-script-python" }
devlanes-platform-bun = { path = "../../crates/platform-bun" }
devlanes-platform-deno = { path = "../../crates/platform-deno" }
devlanes-platform-rust = { path = "../../crates/platform-rust" }
devlanes-preset-next = { path = "../../crates/preset-next" }
devlanes-preset-tauri = { path = "../../crates/preset-tauri" }
devlanes-preset-vite = { path = "../../crates/preset-vite" }
devlanes-preset-wrangler = { path = "../../crates/preset-wrangler" }
devlanes-proxy = { path = "../../crates/proxy" }
devlanes-resolver-dns = { path = "../../crates/resolver-dns" }
devlanes-resolver-hosts = { path = "../../crates/resolver-hosts" }
devlanes-run-script-just = { path = "../../crates/run-script-just" }
