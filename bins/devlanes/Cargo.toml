devlanes-run-script-npm = { path = "../../crates/run-script-npm" }
devlanes-start-gate = { path = "../../crates/start-gate" }
devlanes-state = { path = "../../crates/state" }
devlanes-sys = { path = "../../crates/sys" }
devlanes-transport = { path = "../../crates/transport" }
devlanes-transport-ssh = { path = "../../crates/transport-ssh" }
futures-util.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
crossterm = "0.29"
