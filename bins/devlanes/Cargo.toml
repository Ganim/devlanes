[package]
name = "devlanes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# OS-specific integrations stay above [dependencies] so appended entries land in the shared table.
[target.'cfg(target_os = "macos")'.dependencies]
devlanes-trust-macos = { path = "../../crates/trust-macos" }

[target.'cfg(not(target_os = "macos"))'.dependencies]
devlanes-trust-linux = { path = "../../crates/trust-linux" }

[dependencies]
devlanes-cli = { path = "../../crates/cli" }
devlanes-client = { path = "../../crates/client" }
devlanes-config = { path = "../../crates/config" }
devlanes-daemon = { path = "../../crates/daemon" }
devlanes-ipc = { path = "../../crates/ipc" }
devlanes-pki = { path = "../../crates/pki" }
devlanes-proto = { path = "../../crates/proto" }
devlanes-secrets-fnox = { path = "../../crates/secrets-fnox" }
devlanes-term = { path = "../../crates/term" }
devlanes-term-ghostty = { path = "../../crates/term-ghostty" }
devlanes-term-iterm2 = { path = "../../crates/term-iterm2" }
devlanes-term-kitty = { path = "../../crates/term-kitty" }
devlanes-term-terminal-app = { path = "../../crates/term-terminal-app" }
devlanes-term-wezterm = { path = "../../crates/term-wezterm" }
devlanes-trust = { path = "../../crates/trust" }
devlanes-tui = { path = "../../crates/tui" }
devlanes-core = { path = "../../crates/core" }
devlanes-env-direnv = { path = "../../crates/env-direnv" }
devlanes-env-mise = { path = "../../crates/env-mise" }
devlanes-infra-compose = { path = "../../crates/infra-compose" }
devlanes-infra-docker = { path = "../../crates/infra-docker" }
devlanes-metrics = { path = "../../crates/metrics" }
devlanes-metrics-docker = { path = "../../crates/metrics-docker" }
devlanes-metrics-linux = { path = "../../crates/metrics-linux" }
devlanes-metrics-macos = { path = "../../crates/metrics-macos" }
devlanes-platform-node = { path = "../../crates/platform-node" }
devlanes-platform-python = { path = "../../crates/platform-python" }
devlanes-preset-next = { path = "../../crates/preset-next" }
devlanes-preset-tauri = { path = "../../crates/preset-tauri" }
devlanes-preset-vite = { path = "../../crates/preset-vite" }
devlanes-preset-wrangler = { path = "../../crates/preset-wrangler" }
devlanes-proxy = { path = "../../crates/proxy" }
devlanes-run-script-just = { path = "../../crates/run-script-just" }
devlanes-run-script-make = { path = "../../crates/run-script-make" }
devlanes-run-script-npm = { path = "../../crates/run-script-npm" }
devlanes-runner-pty = { path = "../../crates/runner-pty" }
devlanes-state = { path = "../../crates/state" }
devlanes-sys = { path = "../../crates/sys" }
futures-util.workspace = true
tokio-util.workspace = true
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
crossterm = "0.29"
rustix = { version = "1", features = ["process", "termios"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
