[package]
name = "devlanes-client"
description = "Local daemon client for devlanes CLI, completions, and TUI"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
devlanes-version = { path = "../version" }
bytes.workspace = true
devlanes-core = { path = "../core" }
devlanes-ipc = { path = "../ipc" }
devlanes-proto = { path = "../proto" }
dunce.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tempfile.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(unix)'.dev-dependencies]
# The daemon's lock on Unix, so tests take `daemon.lock` exactly as it does.
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
devlanes-sys-windows = { path = "../sys-windows" }

[lints]
workspace = true
