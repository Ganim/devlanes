project: acme-desktop
templates:
  worker:
    platform: node
    preset: wrangler
    ready: { http: { path: /health, timeout: 180s } }
    tags: [backend]
lanes:
  primary: main
  hosts_file: always
infra:
  containers:
    policy:
      image: ghcr.io/cerbos/cerbos:0.40.0
      command: [server, --config=/policies/config.yaml]
      volumes: ["./policies:/policies:ro"]
      ports: { http: 3592, grpc: 3593 }
      per_lane: true
global_env:
  POLICY_URL: http://127.0.0.1:${{ infra.policy.ports.http }}
tasks:
  install:
    run: pnpm install --frozen-lockfile
    when: lane.create
  migrate:
    run_script: package.json#migrate-local
    when: lane.start
    profiles: [default, backend]
services:
  identity:
    extends: worker
    run_script: workers/identity/package.json#dev
    hosts: ["identity.${{ lane.domain }}"]
  chat:
    extends: worker
    run_script: workers/chat/package.json#dev
    wrangler:
      vars: { IDENTITY_URL: "${{ svc.identity.url }}" }
      args: [--persist-to, .local-state]
    hosts: ["chat.${{ lane.domain }}"]
  desktop-web:
    platform: node
    preset: vite
    run_script: apps/web/package.json#dev
    env: { API_URL: "${{ svc.chat.public_url }}" }
    tags: [desktop]
  desktop:
    platform: node
    preset: tauri
    run_script: apps/desktop/package.json#dev
    tauri:
      identifier: io.example.desktop.lane${{ lane.index }}.client${{ replica.index }}
      dev_url: ${{ svc.desktop_web.url }}
    replicas: 2
    tags: [desktop]
  browser-extension:
    run_script: apps/extension/package.json#dev
    sync:
      - from: apps/extension/.output/chrome-mv3
        ignore: ["*.map"]
    tags: [extension]
  simulator:
    run: npx serve-sim --port ${{ self.port }}
    hosts: ["sim.${{ lane.domain }}"]
    autostart: false
profiles:
  default: [+backend, +desktop]
  backend: [+backend]
  attach:
    include: [+desktop]
    infra: false
    env: { API_URL: "${{ lanes.main.svc.chat.public_url }}" }
