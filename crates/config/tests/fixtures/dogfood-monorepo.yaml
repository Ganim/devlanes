project: acme
templates:
  api:
    platform: node
    ready: { http: { path: /health } }
    tags: [api]
  worker:
    platform: node
    preset: wrangler
    tags: [worker]
lanes:
  primary: main
  hosts_file: always
  vars:
    db_name: acme_${{ lane.name }}
    redis_db: ${{ lane.index }}
    vhost: acme_${{ lane.name }}
infra:
  compose: compose.yaml
  exclude: [legacy-proxy]
  hidden: [postgres]
  hosts:
    object-store: ["storage.${{ lane.domain }}"]
  setup:
    database: [docker, compose, exec, -T, postgres, createdb, "${{ lane.db_name }}"]
    vhost:
      run: docker compose exec -T rabbitmq rabbitmqctl add_vhost ${{ lane.vhost }}
      container: rabbitmq
      ignore_errors: true
  teardown:
    database: docker compose exec -T postgres dropdb --if-exists ${{ lane.db_name }}
    vhost: docker compose exec -T rabbitmq rabbitmqctl delete_vhost ${{ lane.vhost }}
fnox: { profile: development }
global_env:
  DATABASE_URL: postgres://127.0.0.1:${{ infra.postgres.port }}/${{ lane.db_name }}
  REDIS_URL: redis://127.0.0.1:${{ infra.redis.port }}/${{ lane.redis_db }}
tasks:
  build-dependencies:
    run_script: package.json#build-deps
    when: lane.create
  migrate:
    run_script: package.json#migrate
    when: lane.start
  seed:
    run_script: tools/seed/package.json#start
    when: lane.create
    after: services
    timeout: 10m
  build:
    run: pnpm build
    when: lane.start
    profiles: [e2e]
  reset:
    steps: [infra.teardown.database, infra.setup.database, migrate, seed]
    confirm: Reset ${{ lane.db_name }}?
services:
  accounts-api:
    extends: api
    run_script: apps/accounts/package.json#dev
    hosts: ["accounts.${{ lane.domain }}"]
  gateway:
    extends: worker
    run_script: workers/gateway/package.json#dev
    wrangler:
      vars: { API_URL: "${{ svc.accounts_api.url }}" }
    hosts: ["gateway.${{ lane.domain }}"]
  web:
    preset: vite
    run_script: apps/web/package.json#dev
    env: { API_URL: "${{ svc.gateway.public_url }}" }
    hosts: ["${{ lane.domain }}"]
    tags: [web]
  queue:
    run_script: workers/queue/package.json#dev
    ready: { log: Connected }
    tags: [worker]
profiles:
  default: [+api, +worker, +web]
  backend: [+api, +worker]
  frontend:
    include: [+web]
    infra: false
    env: { API_URL: "https://api.example.test" }
  e2e:
    include: [+api, +web]
    run_scripts: { dev: start }
    env: { NODE_ENV: production }
