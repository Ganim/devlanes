[package]
name = "devlanes-daemon"
description = "Per-user devlanes daemon: lanes, processes, infra and state behind a local socket API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
devlanes-proto = { path = "../proto" }
devlanes-ipc = { path = "../ipc" }
devlanes-core = { path = "../core" }
devlanes-logs = { path = "../logs" }
devlanes-config = { path = "../config" }
devlanes-git = { path = "../git" }
devlanes-metrics = { path = "../metrics" }
devlanes-resolve = { path = "../resolve" }
devlanes-resolver-dns = { path = "../resolver-dns" }
devlanes-resolver-hosts = { path = "../resolver-hosts" }
devlanes-state = { path = "../state" }
devlanes-sys = { path = "../sys" }
devlanes-sync = { path = "../sync" }
devlanes-transport = { path = "../transport" }
async-trait.workspace = true
base64.workspace = true
dunce.workspace = true
futures-util.workspace = true
globset = "0.4"
indexmap = "2"
serde.workspace = true
regex = "1"
strip-ansi-escapes = "0.2"
vt100 = "0.18"
bytes.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "fs", "stdio"] }

[dev-dependencies]
devlanes-client = { path = "../client" }
devlanes-proxy = { path = "../proxy" }
devlanes-resolver-hosts = { path = "../resolver-hosts", features = ["fake"] }
devlanes-runner-pty = { path = "../runner-pty" }
devlanes-start-gate = { path = "../start-gate" }
devlanes-tunnel = { path = "../tunnel" }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(windows)'.dev-dependencies]
devlanes-runner-windows = { path = "../runner-windows" }
