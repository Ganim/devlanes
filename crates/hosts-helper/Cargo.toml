[package]
name = "devlanes-hosts-helper"
description = "Root helper that writes devlanes hostnames to a marked block in /etc/hosts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `cargo binstall --git https://github.com/devlanes-run/devlanes devlanes-hosts-helper`
# takes devlanes-hosts from the same release archive as devlanes.
[package.metadata.binstall]
pkg-url = "https://github.com/devlanes-run/devlanes/releases/download/v{ version }/devlanes-{ version }-{ target }.tar.gz"
bin-dir = "devlanes-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install"]

# Runs as root through a NOPASSWD sudo rule, so it stays std-only: every line that
# runs privileged is in this crate. See README.md.
[lib]
name = "devlanes_hosts_helper"
path = "src/lib.rs"

[[bin]]
name = "devlanes-hosts"
path = "src/main.rs"

[dependencies]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
