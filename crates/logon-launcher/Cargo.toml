[package]
name = "devlanes-logon-launcher"
description = "devlanesw.exe: starts the devlanes daemon at Windows logon without a console window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A package of its own, so `cargo run -p devlanes` has one binary to run and
# `cargo install devlanes` on Unix installs no Windows-only launcher.
[[bin]]
name = "devlanesw"
path = "src/main.rs"

# `cargo binstall --git https://github.com/devlanes-run/devlanes devlanes-logon-launcher`
# takes devlanesw.exe from the same Windows release archive as devlanes.exe. The macOS
# and Linux release targets have no launcher, so binstall refuses them (overrides add
# to the disabled strategies, they never remove any).
[package.metadata.binstall]
pkg-url = "https://github.com/devlanes-run/devlanes/releases/download/v{ version }/devlanes-{ version }-{ target }.zip"
bin-dir = "devlanes-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "zip"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.aarch64-apple-darwin]
disabled-strategies = ["crate-meta-data", "compile"]

[package.metadata.binstall.overrides.x86_64-apple-darwin]
disabled-strategies = ["crate-meta-data", "compile"]

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
disabled-strategies = ["crate-meta-data", "compile"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
disabled-strategies = ["crate-meta-data", "compile"]

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
devlanes-client = { path = "../client" }
devlanes-sys = { path = "../sys" }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[target.'cfg(windows)'.dev-dependencies]
tempfile.workspace = true
