[package]
name = "devlanes-logs"
description = "Per-unit log framing, segmented storage, and bounded queries for the devlanes daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
devlanes-proto = { path = "../proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
vte = { version = "0.15", default-features = false }
grep-regex = "0.1"
grep-searcher = "0.1"
jiff = "0.2"
memchr = "2"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
