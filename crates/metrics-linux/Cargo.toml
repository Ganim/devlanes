[package]
name = "devlanes-metrics-linux"
description = "Linux procfs process collector for devlanes-metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Parsers build everywhere so their fixture tests run on macOS CI too.
[dependencies]
devlanes-core = { path = "../core" }
devlanes-metrics = { path = "../metrics" }

[target.'cfg(target_os = "linux")'.dependencies]
async-trait.workspace = true
rustix = { version = "1", features = ["param"] }
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true
