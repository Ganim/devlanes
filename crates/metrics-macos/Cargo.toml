[package]
name = "devlanes-metrics-macos"
description = "macOS libproc process collector for devlanes-metrics"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The crate is empty on other platforms, so its dependencies are macOS-only too.
[target.'cfg(target_os = "macos")'.dependencies]
async-trait.workspace = true
devlanes-core = { path = "../core" }
devlanes-metrics = { path = "../metrics" }
devlanes-sys = { path = "../sys" }
# Only for the `CPU_STATE_*` index constants; all calls go through devlanes-sys.
libc = "0.2"
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The session test's helper process calls `setsid` itself.
rustix = { version = "1", features = ["process"] }

[lints]
workspace = true
