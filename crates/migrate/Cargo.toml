[package]
name = "devlanes-migrate"
description = "Converts mprocs, dekit, process-compose, Procfile, pm2, tmuxinator, tmuxp, package.json and mise setups into devlanes.yaml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
devlanes-config = { path = "../config" }
devlanes-core = { path = "../core" }
globset = "0.4"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
serde.workspace = true
serde_json.workspace = true
serde-saphyr = "2"
thiserror.workspace = true
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
insta = "1"
tempfile.workspace = true

[lints]
workspace = true
