procs:
  # The forms from the mprocs README.
  nvim:
    cmd: ["nvim"]
    autostart: false
  server:
    shell: "nodemon server.js"
    env:
      PORT: "3000"
  webpack: "webpack serve"
  tests:
    shell: "jest -w"
    env:
      NODE_ENV: test
      CI: null
  # Every documented process field.
  API Server:
    cmd: ["cargo", "run", "-p", "acme-api", "--", "--port", "8080"]
    cwd: "<CONFIG_DIR>/api"
    add_path: ["./bin"]
    autorestart: true
    stop: SIGINT
    deps: [db]
    log: ./logs
  db:
    shell: "postgres -D .data/db"
    stop:
      send-keys: ["<C-c>"]
  queue:
    shell: "docker compose up rabbitmq"
    stop:
      cmd: "docker compose stop rabbitmq"
  watcher:
    shell:
      $select: os
      windows: "npm.cmd run watch"
      $else: "npm run watch"
    env:
      TEXT:
        $select: os
        macos: Macos
        linux: Linux
    priority: high
  disabled: null
hide_keymap_window: true
scrollback: 5000
