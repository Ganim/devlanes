name: acme
root: ~/code/tmuxinator
on_project_start: docker compose up -d postgres
on_project_first_start: bin/setup
on_project_stop: docker compose stop
on_project_exit: echo bye
pre_window: export RAILS_ENV=development
startup_window: editor
windows:
  - editor:
      layout: main-vertical
      panes:
        - editor: vim
        - guard
  - server: bundle exec rails s -p 3000
  - logs: tail -f log/development.log
  - frontend:
      root: ~/code/tmuxinator/web
      panes:
        - dev:
            - cd src
            - npm run dev
        - npm run test -- --watch
        -
  - shell: ~
  - elsewhere:
      root: /srv/acme-other
      panes:
        - ./run.sh
