[package]
name = "devlanes-pki"
description = "Per-user certificate authorities and route-authorized TLS certificates for devlanes."
version = "0.3.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rcgen = { version = "0.14", features = ["x509-parser", "zeroize"] }
rustls.workspace = true
rustls-pemfile = "2"
thiserror.workspace = true
time = "0.3"
x509-parser = "0.18"
tempfile.workspace = true
fs2 = "0.4"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "system"] }

[target.'cfg(windows)'.dependencies]
devlanes-sys-windows = { path = "../sys-windows" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
