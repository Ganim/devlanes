[package]
name = "devlanes-proxy"
description = "Streaming HTTP and TLS reverse proxy for devlanes service routes."
version = "0.3.1"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
devlanes-pages = { path = "../pages" }
devlanes-pki = { path = "../pki" }
arc-swap = "1"
bytes.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio.workspace = true
tokio-util.workspace = true
thiserror.workspace = true
tracing.workspace = true
socket2 = "0.6"

# `SO_EXCLUSIVEADDRUSE`, which socket2 does not set.
[target.'cfg(windows)'.dependencies]
devlanes-sys-windows = { path = "../sys-windows" }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = "0.28"
futures-util.workspace = true
x509-parser = "0.18"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["process"] }

[lints]
workspace = true
