[package]
name = "devlanes-resolve"
description = "Lane resolution for devlanes: ports, hostnames, environments and launch plans"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
devlanes-config = { path = "../config" }
devlanes-core = { path = "../core" }
globset = "0.4"
indexmap = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
async-trait.workspace = true
devlanes-platform-bun = { path = "../platform-bun" }
devlanes-platform-deno = { path = "../platform-deno" }
devlanes-platform-node = { path = "../platform-node" }
devlanes-platform-python = { path = "../platform-python" }
devlanes-platform-rust = { path = "../platform-rust" }
insta = { version = "1", features = ["json"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
