[package]
name = "devlanes-runner-pty"
description = "PTY and pipe runner for daemon-owned units, reaped by PID"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# The crate is empty on Windows, which gets its own runner.
[target.'cfg(unix)'.dependencies]
async-trait.workspace = true
bytes.workspace = true
devlanes-core = { path = "../core" }
devlanes-sys = { path = "../sys" }
rustix = { version = "1", features = ["fs", "process", "pty", "stdio", "termios"] }
tokio.workspace = true
tracing.workspace = true
