[package]
name = "devlanes-sys"
description = "Process-table queries, PID-safe signalling and descendant tracking for macOS and Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
devlanes-core = { path = "../core" }
rustix = { version = "1", features = ["process", "std"] }
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
rustix = { version = "1", features = ["fs", "process", "pty", "std"] }
