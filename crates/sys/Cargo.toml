[package]
name = "devlanes-sys"
description = "Process-table queries, PID-safe signalling, descendant tracking and Win32 wrappers for devlanes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
devlanes-core = { path = "../core" }
thiserror.workspace = true
# `NoWindow` for tokio's `Command`; also the pipe wrappers on Windows.
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_System_SystemInformation",
    "Wdk_System_Threading",
    "Win32_Foundation",
    # `RegisterClassW`'s class structure names a GDI brush.
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    # The TUI's copies on the Windows clipboard.
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    # `CancelIoEx` ends a console read nobody answers.
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["fs", "process", "pty", "std"] }

# Certificates for the `windows::cert` tests against scratch stores.
[target.'cfg(windows)'.dev-dependencies]
rcgen = "0.14"
