[package]
name = "devlanes-sys"
description = "Process-table queries, PID-safe signalling, descendant tracking and Win32 wrappers for devlanes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
devlanes-core = { path = "../core" }
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["fs", "process", "pty", "std"] }
