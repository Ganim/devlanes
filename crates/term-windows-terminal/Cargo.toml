[package]
name = "devlanes-term-windows-terminal"
description = "Windows Terminal launcher for devlanes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
devlanes-term = { path = "../term" }

# WSL detection, for the tab that runs `wsl.exe` from inside a distro.
[target.'cfg(target_os = "linux")'.dependencies]
devlanes-sys = { path = "../sys" }

[target.'cfg(windows)'.dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
