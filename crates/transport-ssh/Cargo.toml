[package]
name = "devlanes-transport-ssh"
description = "SSH transport for devlanes remote connect over system OpenSSH with ControlMaster and askpass"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
devlanes-transport = { path = "../transport" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# openssh does not build on Windows, and the crate body is Unix only: there is
# no Windows transport yet.
[target.'cfg(unix)'.dependencies]
openssh = { version = "0.11", default-features = false, features = ["process-mux"] }

[dev-dependencies]
sha2 = "0.10"
tempfile.workspace = true
