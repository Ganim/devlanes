[package]
name = "devlanes-trust-linux"
description = "Linux system CA store and NSS trust stores for the devlanes CA."
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Commands are only built here and run through an injected executor, so the crate
# and its argv tests compile on every Unix platform; only the composition root picks
# it on Linux. The crate is empty on Windows.
[target.'cfg(unix)'.dependencies]
async-trait.workspace = true
# WSL detection and Windows' System32 for the `windows` target.
devlanes-sys = { path = "../sys" }
devlanes-trust = { path = "../trust" }
rustix = { version = "1", features = ["process"] }
tokio.workspace = true

[dev-dependencies]
devlanes-pki = { path = "../pki" }
devlanes-trust = { path = "../trust", features = ["fake"] }
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
