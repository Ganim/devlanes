[package]
name = "devlanes-trust-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Commands are only built here and run through an injected executor, so the crate
# and its argv tests compile on every platform; only the composition root picks it on Linux.
[dependencies]
async-trait.workspace = true
devlanes-trust = { path = "../trust" }
rustix = { version = "1", features = ["process"] }
tokio.workspace = true

[dev-dependencies]
devlanes-pki = { path = "../pki" }
devlanes-trust = { path = "../trust", features = ["fake"] }
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
