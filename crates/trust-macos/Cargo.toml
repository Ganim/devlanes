[package]
name = "devlanes-trust-macos"
description = "macOS keychain and Firefox NSS trust stores for the devlanes CA."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Commands are only built here and run through an injected executor, so the crate
# and its argv tests compile on every Unix platform (Linux CI runs them); only the
# composition root picks it on macOS. Empty on Windows, which has no NSS support.
[target.'cfg(unix)'.dependencies]
async-trait.workspace = true
devlanes-trust = { path = "../trust" }

[dev-dependencies]
devlanes-pki = { path = "../pki" }
devlanes-trust = { path = "../trust", features = ["fake"] }
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
