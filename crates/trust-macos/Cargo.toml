[package]
name = "devlanes-trust-macos"
description = "macOS keychain and Firefox NSS trust stores for the devlanes CA."
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Commands are only built here and run through an injected executor, so the crate
# and its argv tests compile on every platform; only the composition root picks it on macOS.
[dependencies]
async-trait.workspace = true
devlanes-trust = { path = "../trust" }

[dev-dependencies]
devlanes-pki = { path = "../pki" }
devlanes-trust = { path = "../trust", features = ["fake"] }
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
