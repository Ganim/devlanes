[package]
name = "devlanes-trust"
description = "Trust-store trait and shared NSS support for installing the devlanes CA."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exposes `fake::FakeExecutor` for argv tests in the platform crates.
fake = []

[dependencies]
async-trait.workspace = true
base64 = "0.22"
devlanes-sys = { path = "../sys" }
hex = "0.4"
rustls-pki-types = { version = "1", features = ["std"] }
sha1 = "0.10"
sha2 = "0.10"
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
devlanes-pki = { path = "../pki" }
rcgen = "0.14"
tempfile.workspace = true

[lints]
workspace = true
