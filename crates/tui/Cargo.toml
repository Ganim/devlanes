[package]
name = "devlanes-tui"
description = "Terminal UI client for the devlanes daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
base64 = "0.22"
bytes.workspace = true
crossterm = { version = "0.29", features = ["event-stream"] }
devlanes-client = { path = "../client" }
devlanes-proto = { path = "../proto" }
devlanes-term = { path = "../term" }
futures-util.workspace = true
ratatui = "0.30"
serde.workspace = true
serde_json.workspace = true
strip-ansi-escapes = "0.2"
thiserror.workspace = true
tokio.workspace = true
tui-term = { version = "0.3", default-features = false }
unicode-width = "0.2"
vt100 = "0.18"

[dev-dependencies]
# The `screens` example draws every TUI page to PNG for design review.
ab_glyph = "0.2"
devlanes-core = { path = "../core" }
insta = "1"
png = "0.17"
tempfile.workspace = true

[lints]
workspace = true
