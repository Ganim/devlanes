[package]
name = "devlanes-tunnel"
description = "Box side of devlanes remote connect: serves the remote mux from the box's daemon"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
devlanes-version = { path = "../version" }
async-trait.workspace = true
bytes.workspace = true
devlanes-client = { path = "../client" }
devlanes-ipc = { path = "../ipc" }
devlanes-proto = { path = "../proto" }
devlanes-sync = { path = "../sync" }
devlanes-transport = { path = "../transport" }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile.workspace = true
