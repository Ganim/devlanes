# Personal overrides merged over devlanes.yaml: mappings merge by key at every level (a
# service's ready, stop or env keeps the keys left out here), lists and scalars replace.
# Setting run, run_script or steps drops the other two; setting one ready check drops the rest.
lanes:
  max: 3
global_env:
  LOG_LEVEL: debug
services:
  # Changes one setting of a service the base defines.
  user-web:
    autostart: false
  # A service only this machine runs.
  scratch-api:
    extends: fastify-api
    run: node scratch/server.mjs
    hosts: ["scratch.${{ lane.domain }}"]
profiles:
  default: [+essential, user-web]
