[package]
name = "devlanes-e2e"
description = "End-to-end tests that drive the real devlanes binary against fixture projects."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
devlanes-testing = { path = "../crates/testing" }
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

# Process table, verified termination and listeners; Unix uses `ps` and `lsof`.
[target.'cfg(windows)'.dependencies]
devlanes-sys = { path = "../crates/sys" }

# The fake daemon of `protocol_mismatch_exits_4` serves a named pipe.
[target.'cfg(windows)'.dev-dependencies]
tokio.workspace = true
