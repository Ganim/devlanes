# Shared Postgres for every lane. FULL_PG_PORT comes from the primary worktree's .env.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["127.0.0.1:${FULL_PG_PORT:-25432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 60
