# Template for manifests/d/devlanes-run/devlanes/VERSION/ in microsoft/winget-pkgs.
# packaging/winget/render.sh replaces the @...@ placeholders from a release's SHA256SUMS.
# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
PackageIdentifier: devlanes-run.devlanes
PackageVersion: @VERSION@
# ConPTY, which runs `pty: true` units, exists from Windows 10 1809.
MinimumOSVersion: 10.0.17763.0
InstallerType: zip
NestedInstallerType: portable
Commands:
  - devlanes
Installers:
  # Every executable gets a link: devlanes.exe looks for devlanesw.exe and
  # devlanes-hosts-service.exe in the directory it was started from, which is
  # the WinGet\Links directory when winget links the portable.
  - Architecture: x64
    InstallerUrl: https://github.com/devlanes-run/devlanes/releases/download/v@VERSION@/devlanes-@VERSION@-x86_64-pc-windows-msvc.zip
    InstallerSha256: @SHA256_X86_64_PC_WINDOWS_MSVC@
    NestedInstallerFiles:
      - RelativeFilePath: devlanes-@VERSION@-x86_64-pc-windows-msvc\devlanes.exe
        PortableCommandAlias: devlanes
      - RelativeFilePath: devlanes-@VERSION@-x86_64-pc-windows-msvc\devlanesw.exe
        PortableCommandAlias: devlanesw
      - RelativeFilePath: devlanes-@VERSION@-x86_64-pc-windows-msvc\devlanes-hosts-service.exe
        PortableCommandAlias: devlanes-hosts-service
  - Architecture: arm64
    InstallerUrl: https://github.com/devlanes-run/devlanes/releases/download/v@VERSION@/devlanes-@VERSION@-aarch64-pc-windows-msvc.zip
    InstallerSha256: @SHA256_AARCH64_PC_WINDOWS_MSVC@
    NestedInstallerFiles:
      - RelativeFilePath: devlanes-@VERSION@-aarch64-pc-windows-msvc\devlanes.exe
        PortableCommandAlias: devlanes
      - RelativeFilePath: devlanes-@VERSION@-aarch64-pc-windows-msvc\devlanesw.exe
        PortableCommandAlias: devlanesw
      - RelativeFilePath: devlanes-@VERSION@-aarch64-pc-windows-msvc\devlanes-hosts-service.exe
        PortableCommandAlias: devlanes-hosts-service
ManifestType: installer
ManifestVersion: 1.10.0
